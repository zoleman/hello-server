name: Build and Push Docker Image

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

env:
  IMAGE_REPOSITORY: ${{ vars.IMAGE_REPOSITORY }}
  APP_PORT: ${{ vars.APP_PORT }}
  APP_USER: ${{ vars.APP_USER }}

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Setup Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary k8s/

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run Go tests
        run: go test ./...

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_USER=$APP_USER \
            -t $IMAGE_REPOSITORY:${{ github.sha }} \
            .

      - name: Run container
        run: |
          docker run -d \
            --name hello-server-test \
            -e APP_PORT=$APP_PORT \
            -p $APP_PORT:$APP_PORT \
            $IMAGE_REPOSITORY:${{ github.sha }}

      - name: Test health endpoint
        run: curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:$APP_PORT/health

      - name: Stop container
        if: always()
        run: docker rm -f hello-server-test


  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_USER=$APP_USER \
            -t $IMAGE_REPOSITORY:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_REPOSITORY:${{ github.sha }}
          docker tag $IMAGE_REPOSITORY:${{ github.sha }} $IMAGE_REPOSITORY:latest
          docker push $IMAGE_REPOSITORY:latest